
global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: "chat-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

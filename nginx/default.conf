
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Never log raw URLs, arguments, headers, cookies, bodies, IP or socket IDs.
map $request_method $safe_method {
    default OTHER;
    GET GET; POST POST; HEAD HEAD; OPTIONS OPTIONS;
    PUT PUT; DELETE DELETE; PATCH PATCH;
}
map $uri $safe_route {
    default unmatched;
    / /;
    /health /health;
    /api/me /api/me;
    /api/register /api/register;
    /api/login /api/login;
    /api/logout /api/logout;
    /api/rooms/members /api/rooms/members;
}
log_format chat_safe escape=json '{"kind":"chat_safe","safe":"http method=$safe_method route=$safe_route status=$status duration=$request_time bytes=$body_bytes_sent"}';

server {
    listen 80;
    server_name _;
    access_log /dev/stdout chat_safe;
    server_tokens off;
    proxy_hide_header X-Powered-By;
    # Keep a single authoritative value, including Express-generated error pages.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cache-Control;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Hashes use HTML-parser-normalized LF text; update after script/style changes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-2kJwfGbSzZmHS4+SUI18DKHZ06tR5p/sGmrIF4j63VM='; style-src 'self' 'sha256-8eJC1n4gE83izCxLHu+OmiTdhzkASCkjkihz3d4gQEg='; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 2m;

    location /socket.io/ {
        proxy_pass http://app:3000/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://app:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Metrics are scraped directly on the internal Docker network.
    location ~* ^/metrics/?$ { return 404; }
}

# Separate internal listener; port 8081 is never published by Compose.
server {
    listen 8081;
    access_log off;
    server_name _;
    server_tokens off;
    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
    location / { return 404; }
}

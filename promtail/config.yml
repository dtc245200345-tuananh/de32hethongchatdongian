# Promtail is EOL; retained for the course. Use Grafana Alloy for a new system.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /var/lib/promtail/positions.yml
clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
scrape_configs:
  - job_name: chat-docker-safe
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["de32.logging=true"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: (app|nginx)
        action: keep
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: app
        target_label: job
        replacement: nodejs
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: nginx
        target_label: job
        replacement: nginx
    pipeline_stages:
      - json:
          expressions:
            kind: kind
            safe: safe
      - labels:
          kind:
      - match:
          selector: '{job=~"nginx|nodejs",kind!="chat_safe"}'
          action: drop
          drop_counter_reason: non_safe_record
      - output:
          source: safe
      # Defense in depth: reject even a marked record unless its entire output
      # follows our bounded vocabulary (no arbitrary paths or free-form text).
      - match:
          selector: '{job=~"nginx|nodejs"} !~ "^(http method=(GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|OTHER) route=(/|/health|/api/me|/api/register|/api/login|/api/logout|/api/rooms/members|unmatched) status=[0-9]{3} duration=[0-9.]+( bytes=[0-9]+)?|socket_connected|socket_disconnected|server_started)$"'
          action: drop
          drop_counter_reason: unsafe_record_shape
      - labeldrop: [kind]
